<style>
  :root {
    --bg: #fff8ee;
    --card: #ffffff;
    --text: #34303a;
    --muted: #83788a;
    --accent: #ff7b95;
    --accent-soft: #ffe4e9;
    --bot-bubble: #ffffff;
    --user-bubble: #ff7b95;
    --user-text: #ffffff;
    --border: #d3e8f4;
    --danger: #e5484d;
    --sky: #d9eefa;
    --bubble-line: rgba(120, 185, 225, .55);
    --page: #dff1fb;      /* 電腦版：聊天視窗外圍的背景色 */
    --app-h: 100%;        /* 手機版高度，會被下方 JS 依實際可視範圍更新 */
  }
  @supports (height: 100dvh) {
    :root { --app-h: 100dvh; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a20;
      --card: #1f252d;
      --text: #eef3f7;
      --muted: #9fb0bd;
      --accent: #ff8fa5;
      --accent-soft: #3a2a31;
      --bot-bubble: #252d36;
      --user-bubble: #d95f7a;
      --user-text: #ffffff;
      --border: #2e3d4a;
      --danger: #ff6369;
      --sky: #22394a;
      --bubble-line: rgba(255, 255, 255, .18);
      --page: #0f1317;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: var(--app-h);
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
  }
  button { font: inherit; }

  /* ---------- 標題列 ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: linear-gradient(135deg, var(--sky), var(--card) 70%);
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    padding: 0; overflow: hidden; cursor: pointer;
    border: 3px solid var(--card);
    background: var(--sky);
    box-shadow: 0 2px 8px rgba(110, 180, 220, .45);
    animation: bob 3.5s ease-in-out infinite;
  }
  .avatar img { width: 100%; height: 100%; display: block; }
  .avatar.thinking { animation: wobble .7s ease-in-out infinite; }
  .avatar.speaking { animation: hop .5s ease-in-out infinite; }
  .avatar.listening { animation: none; box-shadow: 0 0 0 4px var(--danger); }
  .title { flex: 1; min-width: 0; }
  .title h1 { font-size: 17px; margin: 0; }
  .title p { font-size: 12px; margin: 2px 0 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 50%; width: 36px; height: 36px; cursor: pointer; flex: none; font-size: 16px;
  }
  .iconbtn:hover, .iconbtn[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .reset {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; flex: none;
  }
  .reset:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- 設定面板 ---------- */
  .panel {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 14px;
    font-size: 14px;
    display: grid;
    gap: 12px;
  }
  .panel[hidden] { display: none; }
  .panel label.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .panel input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
  .panel .slider { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; gap: 10px; }
  .panel input[type="range"] { width: 100%; accent-color: var(--accent); }
  .panel .val { color: var(--muted); font-size: 12px; text-align: right; }
  .panel .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .panel .note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .btn-soft {
    border: 1px solid var(--accent); background: var(--card); color: var(--accent);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .btn-soft:hover { background: var(--accent-soft); }

  /* ---------- 訊息 ---------- */
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.user { justify-content: flex-end; }

  }
  .col { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; max-width: 82%; min-width: 0; }
  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
    max-width: 82%;
  }
  .msg-actions { display: flex; gap: 6px; padding-left: 4px; }
  .msg-actions button {
    border: none; background: transparent; color: var(--muted);
    font-size: 12px; padding: 3px 8px; border-radius: 999px; cursor: pointer;
  }
  .msg-actions button:hover { background: var(--accent-soft); color: var(--accent); }
  .msg-actions button.speaking { color: var(--accent); background: var(--accent-soft); }

  .typing .bubble { display: flex; gap: 5px; padding: 14px 16px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- 調酒小幫手卡片 ---------- */
  .card {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 14px;
    display: grid;
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }
  .card-title { font-weight: 700; font-size: 15px; }
  .card .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .card .label b { color: var(--accent); font-size: 15px; }
  .card input[type="range"] { width: 100%; accent-color: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card .go {
    border: none; background: var(--accent); color: #fff;
    border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer; font-weight: 600;
  }

  /* ---------- 快速回覆 ---------- */
  .chips {
    display: flex; gap: 8px; padding: 0 16px 10px;
    overflow-x: auto; flex: none;
  }
  .chip {
    flex: none;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--accent);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { background: var(--accent-soft); }
  .chip:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- 輸入列 ---------- */
  .toast {
    min-height: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 0 16px;
  }
  .toast:not(:empty) { padding-bottom: 6px; }
  form {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font: inherit;
    font-size: 16px; /* 小於 16px 時 iPhone 點輸入框會自動放大畫面 */
    max-height: 120px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .round {
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 18px;
    cursor: pointer;
    flex: none;
  }
  .round.send { background: var(--accent); color: #fff; }
  .round.send:disabled { opacity: .45; cursor: not-allowed; }
  .round.mic { background: var(--accent-soft); color: var(--accent); }
  .round.mic.listening { background: var(--danger); color: #fff; animation: pulse 1.3s infinite; }
  .round.mic[hidden] { display: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(229, 72, 77, .5); }
    70% { box-shadow: 0 0 0 12px rgba(229, 72, 77, 0); }
    100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot, .round.mic.listening { animation: none; }
    #messages { scroll-behavior: auto; }
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 6px 16px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--card);
  }

  /* ---------- 小螢幕手機 ---------- */
  @media (max-width: 480px) {
    header { gap: 8px; padding-left: 12px; padding-right: 12px; }
    .avatar { width: 38px; height: 38px; font-size: 20px; }
    .title p { display: none; }
    #messages { padding: 12px; }
    .col, .row.user .bubble { max-width: 90%; }
    .chips, form, .toast, .panel { padding-left: 12px; padding-right: 12px; }
  }

  /* ---------- 電腦 / 平板：置中的圓角聊天視窗 ---------- */
  @media (min-width: 720px) {
    body { align-items: center; padding: 24px; background: var(--page); }
    .app {
      max-width: 860px;
      height: min(100%, 940px);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(110, 180, 220, .28);
    }
    header, .panel, form { padding-left: 28px; padding-right: 28px; }
    #messages { padding: 24px 28px; }
    .bubble { font-size: 16px; }
    .col, .row.user .bubble { max-width: 72%; }
    .chips { flex-wrap: wrap; overflow-x: visible; padding: 0 28px 12px; }
    form { padding-top: 12px; padding-bottom: 12px; }
  }
  @media (min-width: 720px) and (prefers-color-scheme: dark) {
    .app { box-shadow: 0 16px 48px rgba(0, 0, 0, .5); }
  }

  /* ---------- 活潑效果 ---------- */
  .app > *:not(.bubbles) { position: relative; z-index: 1; }
  .bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bubbles span {
    position: absolute; bottom: -70px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .85), rgba(159, 211, 238, .22));
    border: 1px solid var(--bubble-line);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: .85; }
    90% { opacity: .5; }
    100% { transform: translate(24px, -105vh); opacity: 0; }
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes wobble { 0%, 100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.08); } }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    40% { transform: translateY(-6px) scale(.96, 1.04); }
    60% { transform: translateY(0) scale(1.05, .95); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(8px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  .row { animation: popIn .25s ease-out both; }
  .chip { transition: transform .15s, background .15s; }
  .chip:hover { transform: translateY(-2px) rotate(-1deg); }
  .chip:active { transform: scale(.96); }

  .hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0 8px; text-align: center; }
  .hero-wrap { position: relative; }
  .hero-img {
    display: block; width: min(44vw, 170px); aspect-ratio: 1; padding: 0; cursor: pointer;
    border-radius: 50%; overflow: hidden;
    border: 4px solid var(--card); background: var(--sky);
    box-shadow: 0 8px 24px rgba(110, 180, 220, .4);
    animation: bob 3.2s ease-in-out infinite;
  }
  .hero-img img { width: 100%; height: 100%; display: block; }
  .hero-img:active { transform: scale(.95); }
  .spark { position: absolute; font-size: 18px; animation: twinkle 2.2s ease-in-out infinite; }
  .spark:nth-child(2) { top: 4px; right: -14px; animation-delay: .4s; }
  .spark:nth-child(3) { bottom: 14px; left: -16px; animation-delay: 1s; font-size: 15px; }
  .spark:nth-child(4) { top: -6px; left: 6px; animation-delay: 1.6s; font-size: 14px; }
  @keyframes twinkle { 0%, 100% { transform: scale(.6) rotate(0); opacity: .4; } 50% { transform: scale(1.15) rotate(20deg); opacity: 1; } }
  .hero-name { font-weight: 700; font-size: 18px; }
  .hero-sub { font-size: 13px; color: var(--muted); }

  .burst {
    position: fixed; z-index: 50; pointer-events: none; font-size: 20px;
    margin: -10px 0 0 -10px; animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubbles { display: none; }
    .row, .hero-img, .avatar, .spark, .chip { animation: none !important; transition: none !important; }
  }
</style>

  let sending = false;

  // ---------- 小工具 ----------
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.textContent = ''; }, 3000);
  }

  // ---------- 設定 (存在 localStorage，失敗也不影響使用) ----------
  const DEFAULTS = { autoRead: false, autoSend: true, rate: 1.0 };
  const VOICE_PITCH = 1.15; // 小啵的音調固定，不開放調整
  const settings = Object.assign({}, DEFAULTS, loadSettings());
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem('mixu_settings') || '{}'); } catch (e) { return {}; }
  }
  function saveSettings() {
    try { localStorage.setItem('mixu_settings', JSON.stringify(settings)); } catch (e) {}
  }

  // ---------- Session ----------
  function newSessionId() {
    const arr = new Uint8Array(12);
    crypto.getRandomValues(arr);
    return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
  }
  function getSessionId() {
    try {
      let id = localStorage.getItem('mixu_session');
      if (!id) { id = newSessionId(); localStorage.setItem('mixu_session', id); }
      return id;
    } catch (e) {
      if (!getSessionId.fallback) getSessionId.fallback = newSessionId();
      return getSessionId.fallback;
    }
  }
  function resetSession() {
    try { localStorage.setItem('mixu_session', newSessionId()); } catch (e) {}
    getSessionId.fallback = null;
  }

  // =====================================================
  //  朗讀 (Text-to-Speech)
  // =====================================================
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  let voices = [];
  function loadVoices() { if (synth) voices = synth.getVoices(); }
  if (synth) {
    loadVoices();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
  }
  function pickVoice() {
    return voices.find(v => /^zh[-_]TW/i.test(v.lang)) ||
           voices.find(v => /^zh/i.test(v.lang)) || null;
  }

  // 朗讀前先清掉 Emoji 和符號，並把「$118–$229」念成「118 到 229 元」
  function cleanForSpeech(t) {
    return String(t)
      .replace(/https?:\/\/\S+/g, '')
      .replace(/\$(\d+)\s*[–\-~]\s*\$?(\d+)/g, '$1 到 $2 元')
      .replace(/\$(\d+)/g, '$1 元')
      .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '')
      .replace(/[※・•*#_`]/g, ' ')
      .replace(/^\s*[-－]\s+/gm, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{2,}/g, '\n')
      .trim();
  }
  // 切成短句：部分瀏覽器朗讀太長的文字會中途停住
  function splitChunks(t) {
    const parts = t.match(/[^。！？!?\n]+[。！？!?\n]*/g) || [t];
    const chunks = [];
    let cur = '';
    parts.forEach(p => {
      if ((cur + p).length > 100 && cur) { chunks.push(cur); cur = p; } else { cur += p; }
    });
    if (cur.trim()) chunks.push(cur);
    return chunks;
  }

  let speakingBtn = null;
  function resetSpeakingBtn() {
    avatarBtn.classList.remove('speaking');
    if (speakingBtn) { speakingBtn.classList.remove('speaking'); speakingBtn.textContent = '🔊 朗讀'; speakingBtn = null; }
  }
  function stopSpeaking() {
    if (synth) synth.cancel();
    resetSpeakingBtn();
  }
  function speak(text, btn) {
    if (!synth) { toast('這個瀏覽器不支援朗讀功能'); return; }
    const wasThis = btn && speakingBtn === btn;
    stopSpeaking();
    if (wasThis) return; // 再按一次 = 停止

    const chunks = splitChunks(cleanForSpeech(text));
    if (!chunks.length) return;
    avatarBtn.classList.add('speaking');
    if (btn) { speakingBtn = btn; btn.classList.add('speaking'); btn.textContent = '⏹ 停止'; }

    const voice = pickVoice();
    if (!voice) toast('找不到中文語音，可能會用預設語音念');

    // cancel() 之後馬上 speak() 在部分瀏覽器會被吃掉，所以稍微延遲
    setTimeout(() => {
      chunks.forEach((c, i) => {
        const u = new SpeechSynthesisUtterance(c);
        u.lang = 'zh-TW';
        if (voice) u.voice = voice;
        u.rate = settings.rate;
        u.pitch = VOICE_PITCH;
        if (i === chunks.length - 1) {
          u.onend = u.onerror = () => { if (speakingBtn === btn) resetSpeakingBtn(); };
        }
        synth.speak(u);
      });
    }, 60);
  }
  // iOS Safari 要在使用者點擊時先「解鎖」朗讀，之後的自動朗讀才會出聲
  let speechUnlocked = false;
  function unlockSpeech() {
    if (!synth || speechUnlocked) return;
    speechUnlocked = true;
    try { synth.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
  }

  // =====================================================
  //  語音輸入 (Speech-to-Text)
  // =====================================================
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;

  function setListeningUI(on) {
    listening = on;
    avatarBtn.classList.toggle('listening', on);
    micBtn.classList.toggle('listening', on);
    micBtn.setAttribute('aria-pressed', String(on));
    micBtn.textContent = on ? '⏹' : '🎤';
    inputEl.placeholder = on ? '小啵在聽…請說話 🎧' : '跟小啵說說你想喝什麼…';
  }
  function startListening() {
    if (!SR) { toast('這個瀏覽器不支援語音輸入，建議用 Chrome、Edge 或 Safari'); return; }
    unlockSpeech();
    stopSpeaking(); // 避免小啵的聲音被麥克風收進去
    rec = new SR();
    rec.lang = 'zh-TW';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    let finalText = '';
    let failed = false;

    rec.onstart = () => setListeningUI(true);
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
      }
      inputEl.value = finalText + interim;
      autoGrow();
    };
    rec.onerror = e => {
      failed = true;
      const map = {
        'not-allowed': '麥克風權限被拒絕了，請在瀏覽器網址列旁允許使用麥克風',
        'service-not-allowed': '這個環境不允許語音輸入，請改用 https 網址或 localhost 開啟',
        'no-speech': '小啵沒聽到聲音，再試一次吧',
        'audio-capture': '找不到麥克風',
        'network': '語音辨識需要網路連線'
      };
      if (e.error !== 'aborted') toast(map[e.error] || ('語音輸入失敗：' + e.error));
    };
    rec.onend = () => {
      setListeningUI(false);
      const t = inputEl.value.trim();
      if (!failed && t && settings.autoSend) send(t);
    };
    try { rec.start(); } catch (e) { setListeningUI(false); }
  }
  function stopListening() { if (rec) { try { rec.stop(); } catch (e) {} } }

  // =====================================================
  //  畫面
  // =====================================================
  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function copyText(text) {
    const done = () => toast('已複製 📋');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallbackCopy);
    } else { fallbackCopy(); }
    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('複製失敗'); }
      ta.remove();
    }
  }

  function addMessage(role, text, withActions) {
    const row = el('div', 'row ' + role);
    if (role === 'bot') {
      row.appendChild(el('div', 'mini', '🫧'));
      const col = el('div', 'col');
      col.appendChild(el('div', 'bubble', text)); // textContent：回覆內容不會被當成 HTML 執行
      if (withActions) {
        const actions = el('div', 'msg-actions');
        const readBtn = el('button', '', '🔊 朗讀');
        readBtn.type = 'button';
        readBtn.addEventListener('click', () => { unlockSpeech(); speak(text, readBtn); });
        const copyBtn = el('button', '', '📋 複製');
        copyBtn.type = 'button';
        copyBtn.addEventListener('click', () => copyText(text));
        actions.append(readBtn, copyBtn);
        col.appendChild(actions);
      }
      row.appendChild(col);
    } else {
      row.appendChild(el('div', 'bubble', text));
    }
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }
  function addTyping() {
    const row = el('div', 'row bot typing');
    row.innerHTML = '<div class="mini">🫧</div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }
  function setSending(state) {
    sending = state;
    avatarBtn.classList.toggle('thinking', state);
    sendBtn.disabled = state;
    chipsEl.querySelectorAll('.chip').forEach(c => { c.disabled = state; });
  }
  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  // ---------- 快速回覆 ----------
  function renderChips(list) {
    chipsEl.innerHTML = '';
    list.forEach(item => {
      const b = el('button', 'chip', item.label);
      b.type = 'button';
      b.addEventListener('click', () => {
        if (item.action === 'picker') openPicker();
        else send(item.text);
      });
      chipsEl.appendChild(b);
    });
    chipsEl.scrollLeft = 0;
  }

  // ---------- 🎯 調酒小幫手 (用選的，不用打字) ----------
  function openPicker() {
    const existing = $('picker');
    if (existing) { existing.scrollIntoView({ block: 'center' }); return; }

    const st = { budget: 150, flavors: new Set(), strength: '適中', type: '都可以' };
    const row = el('div', 'row bot');
    row.id = 'picker';
    row.appendChild(el('div', 'mini', '🫧'));
    const card = el('div', 'card');
    card.appendChild(el('div', 'card-title', '🎯 小啵調酒小幫手'));

    // 預算
    const b = el('div');
    const bl = el('div', 'label');
    bl.append('預算：');
    const bv = el('b', '', String(st.budget));
    bl.append(bv, ' 元');
    const range = document.createElement('input');
    range.type = 'range'; range.min = 50; range.max = 300; range.step = 10; range.value = st.budget;
    range.setAttribute('aria-label', '預算');
    range.addEventListener('input', () => { st.budget = +range.value; bv.textContent = range.value; });
    b.append(bl, range);
    card.appendChild(b);

    function group(title, options, multi, key) {
      const g = el('div');
      g.appendChild(el('div', 'label', title));
      const wrap = el('div', 'opts');
      options.forEach(o => {
        const btn = el('button', 'opt', o);
        btn.type = 'button';
        const isOn = () => multi ? st[key].has(o) : st[key] === o;
        btn.setAttribute('aria-pressed', String(isOn()));
        btn.addEventListener('click', () => {
          if (multi) { st[key].has(o) ? st[key].delete(o) : st[key].add(o); }
          else { st[key] = o; wrap.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', 'false')); }
          btn.setAttribute('aria-pressed', String(isOn()));
        });
        wrap.appendChild(btn);
      });
      g.appendChild(wrap);
      card.appendChild(g);
    }
    group('想喝什麼口味？（可多選）', ['酸甜果香', '茶香', '奶香', '無糖氣泡', '咖啡可可'], true, 'flavors');
    group('想要多醉？', ['超輕鬆微醺', '適中', '夠勁'], false, 'strength');
    group('想喝哪一種？', ['DIY 特調', '罐裝即飲', '都可以'], false, 'type');

    const go = el('button', 'go', '請小啵推薦 ✨');
    go.type = 'button';
    go.addEventListener('click', () => {
      const flavor = st.flavors.size ? [...st.flavors].join('、') + '口味' : '口味不限';
      const msg = '我預算大約 ' + st.budget + ' 元，想喝' + flavor + '，酒感想要' + st.strength +
                  '，偏好' + st.type + '，請幫我推薦，並列出採購清單與比例！';
      row.remove();
      send(msg);
    });
    card.appendChild(go);

    row.appendChild(card);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  // =====================================================
  //  活潑效果：歡迎大圖、戳戳小啵、飄浮泡泡
  // =====================================================
  const REDUCED_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const POKE_LINES = [
    '啵！被你戳到啦～🫧',
    '叮咚～要喝點什麼嗎？🍹',
    '小啵在這裡唷！✨',
    '咕嚕咕嚕～氣泡滿滿！🧊',
    '嘿嘿，癢癢的啦～💖'
  ];

  function burst(x, y, n) {
    if (REDUCED_MOTION) return;
    const icons = ['🫧', '✨', '🍹', '🧊', '💖', '🍋'];
    for (let i = 0; i < n; i++) {
      const s = el('span', 'burst', icons[Math.floor(Math.random() * icons.length)]);
      const ang = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 60;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      document.body.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
  }
  function burstFromEl(node, n) {
    const r = node.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, n);
  }
  function poke(node) {
    burstFromEl(node, 8);
    toast(POKE_LINES[Math.floor(Math.random() * POKE_LINES.length)]);
  }
  avatarBtn.addEventListener('click', () => poke(avatarBtn));

  // 對話最上面的歡迎大圖
  function addHero() {
    const hero = el('div', 'hero');
    const wrap = el('div', 'hero-wrap');
    const btn = el('button', 'hero-img');
    btn.type = 'button';
    btn.setAttribute('aria-label', '戳戳小啵');
    const img = document.createElement('img');
    img.src = HERO_SRC;
    img.alt = '小啵：一顆拿著冰飲、戴著彩虹蝴蝶結的氣泡小精靈';
    img.width = 170; img.height = 170;
    btn.appendChild(img);
    btn.addEventListener('click', () => poke(btn));
    wrap.append(btn, el('span', 'spark', '✨'), el('span', 'spark', '🫧'), el('span', 'spark', '✨'));
    hero.append(wrap, el('div', 'hero-name', '嗨，我是小啵 Bobo！'), el('div', 'hero-sub', 'MIX U 的實習小酒保 🧊'));
    messagesEl.appendChild(hero);
  }

  // 背景飄浮的泡泡
  (function initBubbles() {
    const wrap = $('bubbles');
    if (!wrap || REDUCED_MOTION) return;
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('span');
      const size = 14 + Math.random() * 34;
      b.style.width = b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = 9 + Math.random() * 9 + 's';
      b.style.animationDelay = -Math.random() * 14 + 's';
      wrap.appendChild(b);
    }
  })();

  // =====================================================
  //  送出訊息
  // =====================================================
  async function send(text) {
    text = (text || '').trim();
    if (!text || sending) return;
    unlockSpeech();
    stopSpeaking();
    if (listening) stopListening();

    if (API_URL.indexOf('PASTE_YOUR') === 0) {
      addMessage('bot', '還沒設定後端網址唷！請先把 Apps Script 的 /exec 網址貼到 HTML 裡的 API_URL。');
      return;
    }

    const pk = $('picker'); if (pk) pk.remove();
    addMessage('user', text);
    inputEl.value = '';
    autoGrow();
    setSending(true);
    const typing = addTyping();

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    let reply = FALLBACK;
    try {
      // Content-Type 用 text/plain，是為了避開瀏覽器的 CORS 預檢 (Apps Script 不支援 OPTIONS)
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ channel: 'web', sessionId: getSessionId(), message: text }),
        signal: controller.signal
      });
      if (res.ok) {
        const data = await res.json();
        if (data && typeof data.reply === 'string' && data.reply) reply = data.reply;
      } else {
        console.error('HTTP ' + res.status);
      }
    } catch (err) {
      console.error(err);
    } finally {
      clearTimeout(timer);
    }

    typing.remove();
    const botRow = addMessage('bot', reply, true);
    setSending(false);
    if (reply !== FALLBACK) burstFromEl(avatarBtn, 4);
    renderChips(FOLLOW_CHIPS);

    if (settings.autoRead && reply !== FALLBACK) {
      const btn = botRow.querySelector('.msg-actions button');
      speak(reply, btn);
    }
  }

  // =====================================================
  //  事件與初始化
  // =====================================================
  formEl.addEventListener('submit', e => { e.preventDefault(); send(inputEl.value); });
  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', e => {
    // Enter 送出、Shift+Enter 換行；注音/拼音選字時的 Enter 不送出
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send(inputEl.value);
    }
  });
  micBtn.addEventListener('click', () => { listening ? stopListening() : startListening(); });

  resetBtn.addEventListener('click', () => {
    stopSpeaking();
    if (listening) stopListening();
    resetSession();
    messagesEl.innerHTML = '';
    addHero();
    addMessage('bot', GREETING);
    renderChips(START_CHIPS);
  });

  // 設定面板
  settingsBtn.addEventListener('click', () => {
    const open = panelEl.hidden;
    panelEl.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', String(open));
  });
  const optAutoRead = $('optAutoRead'), optAutoSend = $('optAutoSend');
  const optRate = $('optRate');
  function syncPanel() {
    optAutoRead.checked = settings.autoRead;
    optAutoSend.checked = settings.autoSend;
    optRate.value = settings.rate;
    $('rateVal').textContent = Number(settings.rate).toFixed(2) + 'x';
  }
  optAutoRead.addEventListener('change', () => {
    settings.autoRead = optAutoRead.checked; saveSettings();
    if (settings.autoRead) unlockSpeech();
  });
  optAutoSend.addEventListener('change', () => { settings.autoSend = optAutoSend.checked; saveSettings(); });
  optRate.addEventListener('input', () => { settings.rate = +optRate.value; saveSettings(); syncPanel(); });
  $('testVoiceBtn').addEventListener('click', () => {
    unlockSpeech();
    speak('叮咚～我是小啵！今天想來點什麼口味的微醺呀？', null);
  });

  // 瀏覽器支援度提示
  const notes = [];
  if (!SR) notes.push('此瀏覽器不支援語音輸入');
  if (!synth) notes.push('此瀏覽器不支援朗讀');
  $('supportNote').textContent = notes.join('；');
  if (!SR) { micBtn.hidden = true; }
  if (!synth) { optAutoRead.disabled = true; $('testVoiceBtn').disabled = true; }

  window.addEventListener('pagehide', () => { stopSpeaking(); });

  // 手機鍵盤彈出時，讓聊天視窗縮到「看得見的範圍」，輸入列才不會被鍵盤蓋住
  if (window.visualViewport) {
    const fitViewport = () => {
      document.documentElement.style.setProperty('--app-h', window.visualViewport.height + 'px');
      window.scrollTo(0, 0);
      scrollToBottom();
    };
    window.visualViewport.addEventListener('resize', fitViewport);
  }

  syncPanel();
  addHero();
  addMessage('bot', GREETING);
  renderChips(START_CHIPS);
</script>
</body>
</html>
